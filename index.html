 if(AT==='blog')b=`<form class="f" id="pf" style="margin-bottom:16px"><input id="pt" placeholder="Заголовок статьи"><textarea id="px" placeholder="Текст (абзацы через пустую строку)" style="min-height:160px"></textarea><div class="row"><button class="btn pri">Сохранить статью</button><button type="button" class="btn" onclick="PE='';vAdmin('blog')">Новая</button></div></form>${LS(POSTS,p=>`<div class="box row"><div><b>${esc(p.title)}</b><div class="mu" style="font-size:14px">${dt(p.ts)}</div></div><span><button class="btn sm" onclick="editPost('${p.id}')">Изменить</button> <button class="btn sm" onclick="delPost('${p.id}',this)">Удалить</button></span></div>`)}`;
 if(AT==='site')b=`<form class="f fl" id="sf" style="max-width:720px">${FLD.map(f=>`<label>${f[1]}</label>${f[2]?`<textarea data-k="${f[0]}" style="min-height:${f[0]==='about'||f[0]==='biz'?200:110}px">${esc(C[f[0]])}</textarea>`:`<input data-k="${f[0]}" value="${esc(C[f[0]])}">`}`).join('')}<div class="row"><button class="btn pri">Сохранить тексты</button><button type="button" class="btn" onclick="resetSite(this)">Вернуть исходные</button></div></form>`;
 $('#app').innerHTML=`<main class="page"><h2>Админ-панель</h2><p class="mu">Пользователей: ${j.users}</p><div class="tabs">${T.map(x=>`<button class="btn sm ${AT===x[0]?'on':''}" onclick="vAdmin('${x[0]}')">${x[1]}</button>`).join('')}</div>${b}</main>`;
 if(AT==='blog')$('#pf').onsubmit=async e=>{e.preventDefault();try{await api('savePost',{id:PE,title:$('#pt').value.trim(),text:$('#px').value});PE='';toast('Статья сохранена');vAdmin('blog')}catch(e){}};
 if(AT==='site')$('#sf').onsubmit=async e=>{e.preventDefault();const o={};document.querySelectorAll('#sf [data-k]').forEach(i=>o[i.dataset.k]=i.value);try{await api('saveSite',{site:JSON.stringify(o)});C=Object.assign({},DEF,o);fillFoot();toast('Тексты сохранены, сайт обновлён')}catch(e){}}}
function editPost(id){const p=POSTS.find(x=>x.id===id);if(!p)return;PE=id;$('#pt').value=p.title;$('#px').value=p.text;scrollTo(0,0)}
async function delPost(id,b){if(!two(b,'Точно удалить?'))return;try{await api('delPost',{id});vAdmin('blog')}catch(e){}}
async function mod(id,s,b){if(s==='deleted'&&!two(b,'Точно удалить?'))return;try{await api('mod',{id,s});toast('Готово');vAdmin(AT)}catch(e){}}
async function resetSite(b){if(!two(b,'Точно сбросить?'))return;try{await api('saveSite',{site:''});C=Object.assign({},DEF);fillFoot();toast('Тексты сброшены');vAdmin('site')}catch(e){}}
loadSite().then(()=>go('home'));
</script></body></html>
